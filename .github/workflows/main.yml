
name: Extract POS Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          mkdir -p /tmp/pos-project
          unzip -q restaurant_pos_phase15_github_build_workflows.zip -d /tmp/pos-project
          cp -a /tmp/pos-project/. .
          rm restaurant_pos_phase15_github_build_workflows.zip

      - name: Commit project files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Extract complete POS project"
            git push
          fi
